<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Aplikasi</title>
<meta name="description" content="Satu tempat untuk membuka semua aplikasi Anda.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#4f46e5; --accent-soft:#eef2ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1020; --card:#151b2e; --text:#e8ecf6; --muted:#94a3b8; --line:#26304a; --accent:#818cf8; --accent-soft:#1c2347; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}
  button,input{font:inherit}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn[hidden]{display:none}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:16px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.12);outline:none}
  .avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;background:#fff}
  .nama{font-weight:600;font-size:15px}
  .desk{color:var(--muted);font-size:13px;line-height:1.3}
  .pin{position:absolute;top:8px;right:8px;border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted);padding:4px;line-height:1}
  .pin[aria-pressed="true"]{color:#f59e0b}
  .kosong{color:var(--muted);text-align:center;padding:40px 0}
  .status{font-size:12px;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="judul">Dashboard Aplikasi</h1>
      <div class="sub" id="hitung"></div>
    </div>
    <button class="btn primary" id="btnInstall" hidden>Pasang aplikasi</button>
  </header>

  <input id="cari" class="search" type="search" placeholder="Cari aplikasi…  (tekan / untuk fokus)" aria-label="Cari aplikasi" autocomplete="off">
  <div class="chips" id="chips" role="group" aria-label="Filter kategori"></div>

  <div id="isi"></div>
  <div class="status" id="status"></div>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const LS = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let apps = [];
  let kategori = "Semua";
  let pins = new Set(LS.get("pins", []));

  const warna = (s) => {
    let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `hsl(${h} 55% 45%)`;
  };

  const fav = (url) => {
    try { return "https://www.google.com/s2/favicons?domain=" + new URL(url).hostname + "&sz=64"; }
    catch (e) { return ""; }
  };

  function kartu(a) {
    const el = document.createElement("div");
    el.style.position = "relative";
    const link = document.createElement("a");
    link.className = "card";
    link.href = a.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const av = document.createElement("div");
    av.className = "avatar";
    av.style.background = warna(a.nama);
    av.textContent = a.nama.trim().charAt(0).toUpperCase();
    const img = new Image();
    img.alt = "";
    img.onload = () => { av.textContent = ""; av.style.background = "#fff"; av.appendChild(img); };
    img.src = fav(a.url);

    const n = document.createElement("div"); n.className = "nama"; n.textContent = a.nama;
    const d = document.createElement("div"); d.className = "desk"; d.textContent = a.deskripsi || a.kategori || "";
    link.append(av, n, d);

    const pin = document.createElement("button");
    pin.className = "pin";
    pin.setAttribute("aria-pressed", pins.has(a.url));
    pin.setAttribute("aria-label", "Sematkan " + a.nama);
    pin.textContent = pins.has(a.url) ? "★" : "☆";
    pin.onclick = (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      pins.has(a.url) ? pins.delete(a.url) : pins.add(a.url);
      LS.set("pins", [...pins]);
      render();
    };

    el.append(link, pin);
    return el;
  }

  function bagian(judul, daftar) {
    const frag = document.createDocumentFragment();
    const h = document.createElement("h2"); h.textContent = judul;
    const g = document.createElement("div"); g.className = "grid";
    daftar.forEach((a) => g.appendChild(kartu(a)));
    frag.append(h, g);
    return frag;
  }

  function render() {
    const q = $("#cari").value.trim().toLowerCase();
    const hasil = apps.filter((a) =>
      (kategori === "Semua" || a.kategori === kategori) &&
      (!q || (a.nama + " " + (a.deskripsi || "") + " " + (a.kategori || "")).toLowerCase().includes(q))
    );

    const isi = $("#isi");
    isi.replaceChildren();
    $("#hitung").textContent = `${hasil.length} dari ${apps.length} aplikasi`;

    if (!hasil.length) {
      const k = document.createElement("div");
      k.className = "kosong";
      k.textContent = apps.length ? "Tidak ada aplikasi yang cocok." : "Belum ada aplikasi. Isi apps.json.";
      isi.appendChild(k);
      return;
    }

    const sematan = hasil.filter((a) => pins.has(a.url));
    if (sematan.length) isi.appendChild(bagian("Disematkan", sematan));

    if (kategori === "Semua") {
      const peta = new Map();
      hasil.filter((a) => !pins.has(a.url)).forEach((a) => {
        const k = a.kategori || "Lainnya";
        if (!peta.has(k)) peta.set(k, []);
        peta.get(k).push(a);
      });
      peta.forEach((v, k) => isi.appendChild(bagian(k, v)));
    } else {
      const sisa = hasil.filter((a) => !pins.has(a.url));
      if (sisa.length) isi.appendChild(bagian(kategori, sisa));
    }
  }

  function buatChips() {
    const semua = ["Semua", ...new Set(apps.map((a) => a.kategori || "Lainnya"))];
    const c = $("#chips");
    c.replaceChildren();
    semua.forEach((k) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = k;
      b.setAttribute("aria-pressed", k === kategori);
      b.onclick = () => { kategori = k; buatChips(); render(); };
      c.appendChild(b);
    });
  }

  async function muat() {
    try {
      const res = await fetch("apps.json", { cache: "no-cache" });
      const data = await res.json();
      apps = (data.apps || []).filter((a) => a && a.nama && a.url);
      if (data.judul) { $("#judul").textContent = data.judul; document.title = data.judul; }
      LS.set("cache", data);
    } catch (e) {
      const data = LS.get("cache", null);
      if (data) { apps = data.apps || []; $("#status").textContent = "Mode offline: memakai daftar tersimpan."; }
      else { $("#status").textContent = "Gagal memuat apps.json."; }
    }
    buatChips();
    render();
  }

  $("#cari").addEventListener("input", render);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#cari").focus(); }
  });
  if (new URLSearchParams(location.search).get("fokus") === "cari") $("#cari").focus();

  // Tombol pasang
  let tunda = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); tunda = e; $("#btnInstall").hidden = false; });
  $("#btnInstall").onclick = async () => {
    if (!tunda) return;
    tunda.prompt(); await tunda.userChoice; tunda = null; $("#btnInstall").hidden = true;
  };
  window.addEventListener("appinstalled", () => { $("#btnInstall").hidden = true; });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  muat();
})();
</script>
</body>
</html>
